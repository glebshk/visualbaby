name: fly-x500-real

windows:
  - main:
      layout: even-vertical
      panes:
        - main_node:
            - printf '\033]2;%s\033\\' 'main'
            - source install/setup.bash
            - ros2 run fly_main exec
          
  - communication:
      layout: even-vertical
      panes:
        - ros_to_px4:
            - printf '\033]2;%s\033\\' 'ros_to_px4'
            - source install/setup.bash
            - ros2 launch px4_to_ros2 launch_fly.py

        - camera:
            - printf '\033]2;%s\033\\' 'camera'
            - source install/setup.bash
            - ros2 launch camera_node launch_camera.py
        
  - detect:
      layout: even-vertical
      panes:
        - aruco_detect:
            detect:
            - source install/setup.bash
            - sleep 15
            - ros2 launch aruco_detect launch_fly.py
        
        - peripherals:
            - source install/setup.bash
            - sleep 15
            - ros2 launch peripherals_node launch_fly.py
        