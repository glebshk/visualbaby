# Started by scripts/launch-sim-aufdeckung.sh (it exports the AUFDECKUNG_* and START_* variables).
name: aufdeckung-sim

windows:
  - simulation:
      layout: even-vertical
      panes:
        - gazebo:
            # Mouse mode: click a window name in the bottom bar or a pane to switch, scroll with
            # the wheel. VS Code's terminal swallows Ctrl+B (it toggles the sidebar there).
            - tmux set -g mouse on; tmux set -g history-limit 50000
            # Narrow terminals cut off the window list: show only the window names.
            - tmux set -g status-left ''; tmux set -g status-right ' click a window name to switch '
            - source install/setup.bash
            - ./scripts/launch-gazebo-default.sh $AUFDECKUNG_WORLD
        - px4:
            - source install/setup.bash
            - sleep 5
            - ./scripts/spawn-x500-aufdeckung.sh $START_X $START_Y && sleep 3 && ./scripts/launch-sitl-aufdeckung.sh
  - ros2:
      layout: even-vertical
      panes:
        - mission:
            - source install/setup.bash
            - sleep 30
            - ros2 launch aufdeckung_ros aufdeckung_sim.launch.py home_x:=$START_X home_y:=$START_Y
        - monitor:
            - source install/setup.bash
            - sleep 35
            - ros2 topic echo /aufdeckung/phase
