name: sim-x500-indoor

windows:
  - ros2:
      layout: even-vertical
      panes:
        - sitl:
            - printf '\033]2;%s\033\\' 'sitl'
            - source install/setup.bash
            - sleep 10
            - ./scripts/spawn-x500-indoor.sh
            - sleep 5
            - ./scripts/launch-sitl-x500-indoor.sh
            - sleep 6
            - param set MIS_TAKEOFF_ALT 2.0m
        - sim-launch:
            - printf '\033]2;%s\033\\' 'sim-launch'
            - source install/setup.bash
            - sleep 15
            - ros2 run px4_to_ros2 px4
        - fly:
            - source install/setup.bash
            - sleep 30
            - ros2 run fly_main exec
        - detect:
            - source install/setup.bash
            - sleep 15
            - ros2 launch aruco_detect launch_sim.py
        - peripherals:
            - source install/setup.bash
            - sleep 15
            - ros2 launch peripherals_node launch_sim.py
        
  - simulation:
      layout: even-vertical
      panes:
        - gazebo:
            - printf '\033]2;%s\033\\' 'gazebo'
            - source install/setup.bash
            - ./scripts/launch-gazebo-default.sh

        - gz-bridge:
            - source install/setup.bash
            - sleep 3
            - ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=/workspaces/IMAV/simulation/gz-bridge.yaml
        
        - moving-landing:
            - source install/setup.bash
            - sleep 10
            - ./scripts/start_moving_platform.sh
