# Gazebo <-> ROS 2 topics for the aufdeckung simulation (ros_gz_bridge parameter_bridge).

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# 3D lidar (x500_aufdeckung) -> mapping
- ros_topic_name: "/lidar/points"
  gz_topic_name: "/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Downward camera (OakD-Lite_down) -> object detection / triangulation (teammates)
- ros_topic_name: "/camera/bottom/rgb"
  gz_topic_name: "/camera/bottom/rgb"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/bottom/depth"
  gz_topic_name: "/camera/bottom/depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
