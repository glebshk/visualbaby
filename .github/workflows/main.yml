name: Build Base and Dev Docker Images
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: self-hosted
    outputs:
      base_changed: ${{ steps.filter.outputs.base }}
      dev_changed: ${{ steps.filter.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
      - name: Check changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'docker/base/**'
            dev:
              - 'docker/sim/**'

  build-base:
    runs-on: self-hosted
    needs: check-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.check-changes.outputs.base_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aachen-drone-development-initiative/imav/base:latest
  
  build-drone:
    runs-on: self-hosted
    needs: [check-changes, build-base]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       needs.check-changes.outputs.base_changed == 'true')
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push drone image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/drone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aachen-drone-development-initiative/imav/drone:latest


  build-dev:
    runs-on: self-hosted
    needs: [check-changes, build-base]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       needs.check-changes.outputs.dev_changed == 'true' ||
       needs.check-changes.outputs.base_changed == 'true')
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sim/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/aachen-drone-development-initiative/imav/dev:latest