name: Build docker Images

on:
  push:
    branches: [ "Gazebo" ]
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      base_changed: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'docker/base/**'

  build-base:
    runs-on: [self-hosted]
    needs: check-changes
    if: needs.check-changes.outputs.base_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push with cache
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/base/Dockerfile 
          platforms:  linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aachen-drone-development-initiative/imav-videostream/imav:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-main:
    runs-on: [self-hosted]
    needs: [check-changes, build-base]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Base changed: ${{ needs.check-changes.outputs.base_changed }}"
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push with cache
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./docker/sim/Dockerfile 
          platforms: linux/amd64
          push: true
          tags: ghcr.io/aachen-drone-development-initiative/imav-videostream/imav-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max