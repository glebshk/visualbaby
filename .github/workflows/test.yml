name: Build Base and Dev Docker test Images
on:
  push:
    branches:
      - #your test branch here
jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      base_changed: ${{ steps.filter.outputs.base }}
      drone_changed: ${{ steps.filter.outputs.drone }}
    steps:
      - uses: actions/checkout@v4
      - name: Check changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'docker/base/**'

  build-base:
    runs-on: self-hosted
    needs: check-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.check-changes.outputs.base_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aachen-drone-development-initiative/imav-videostream/imav:latest
