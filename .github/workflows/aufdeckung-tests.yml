name: aufdeckung tests

on:
  push:
    paths: ["aufdeckung/**", "src/aufdeckung_ros/**", ".github/workflows/aufdeckung-tests.yml"]
  pull_request:
    paths: ["aufdeckung/**", "src/aufdeckung_ros/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: aufdeckung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,viz]"
      - run: ruff check src tests ../src/aufdeckung_ros
      - run: python -m mypy src
      - run: python -m pytest -m "not slow" -q
      - run: python -m pytest -q ../src/aufdeckung_ros/test
