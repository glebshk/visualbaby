name: aufdeckung tests

on:
  push:
    paths: ["aufdeckung/**", "src/aufdeckung_ros/**", "scripts/check.sh", ".github/workflows/aufdeckung-tests.yml"]
  pull_request:
    paths: ["aufdeckung/**", "src/aufdeckung_ros/**", "scripts/check.sh"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e "aufdeckung[dev,viz]"
      # Same script as the local development loop, so local green == CI green.
      - run: ./scripts/check.sh
        env:
          PYTHON: python
